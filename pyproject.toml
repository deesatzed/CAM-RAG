[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "cam-rag-platform"
version = "0.1.0"
description = "Reusable RAG platform with Ragamuffin as the first document-folder app."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "deesatzed" },
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "httpx>=0.24",
]
docx = [
    "python-docx>=1.1.0",
]
pdf = [
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
finetune = [
    "sentence-transformers>=5.0",
    "datasets>=4.0",
    "accelerate>=1.0",
]
benchmark = [
    "mteb>=2.2.0",
    "sentence-transformers>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cam_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "llm_live: requires ollama + pii-redaction-healthcare model running locally",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "SIM", "RUF"]
