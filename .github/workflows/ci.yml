name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src/cam_rag benchmarks/mteb
      - name: Tests
        run: python -m pytest tests/ -q --tb=short
      - name: Coverage gate
        run: python -m pytest --cov=cam_rag --cov-fail-under=86 -q --tb=line
